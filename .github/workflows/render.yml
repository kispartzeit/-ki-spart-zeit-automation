name: KI spart Zeit – Video produzieren

on:
  workflow_dispatch:
    inputs:
      auswahl:
        description: "all, auto oder Videoindex 0/1/2"
        required: true
        default: "all"
  schedule:
    # GitHub cron kennt keine Sommerzeit. Beide UTC-Zeiten starten; ein Gate
    # lässt nur exakt 18:30 Uhr Europe/Berlin weiterlaufen.
    - cron: "30 16,17 * * 1,3,5"
  push:
    paths:
      - "content/queue.json"
      - "scripts/**"
      - ".github/workflows/render.yml"

permissions:
  contents: read

jobs:
  produzieren:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Berliner Veröffentlichungszeit prüfen
        id: berlin
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/Berlin date +%H:%M)" = "18:30" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dateien laden
        if: steps.berlin.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Python einrichten
        if: steps.berlin.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Video-Werkzeuge installieren
        if: steps.berlin.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inhalte prüfen
        if: steps.berlin.outputs.run == 'true'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/validate_content.py content/queue.json --require-current-week
          else
            python scripts/validate_content.py content/queue.json
          fi

      - name: Auswahl bestimmen
        if: steps.berlin.outputs.run == 'true'
        id: choice
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.auswahl }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "value=auto" >> "$GITHUB_OUTPUT"
          else
            echo "value=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Video rendern
        if: steps.berlin.outputs.run == 'true'
        run: python scripts/render.py --index "${{ steps.choice.outputs.value }}"

      - name: Fertige Dateien bereitstellen
        if: steps.berlin.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ki-spart-zeit-videos
          path: dist/
          retention-days: 30
          if-no-files-found: error
